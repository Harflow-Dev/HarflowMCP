name: Engine checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --ignore=tests/test_monitor_profile.py --ignore=tests/test_swift_package_runner.py
      - run: bash scripts/check-private-refs.sh
      - run: uv run python scripts/check-legacy-names.py
